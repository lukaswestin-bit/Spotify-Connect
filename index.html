<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working Live Audio Equalizer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #121212;
            color: white;
        }
        .container {
            text-align: center;
            padding: 30px;
            background: #181818;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 350px;
            border: 1px solid #282828;
        }
        input[type="file"] {
            margin: 20px 0;
            color: #b3b3b3;
        }
        audio {
            width: 100%;
            margin-bottom: 20px;
        }
        .eq-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: left;
        }
        .slider-group {
            display: flex;
            flex-direction: column;
        }
        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #b3b3b3;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #007bff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Audio File EQ</h1>
        <p style="color: #b3b3b3; font-size: 14px;">Select any music file (MP3/WAV) from your device to test the real-time equalizer:</p>
        
        <input type="file" id="audio-file" accept="audio/*">
        <audio id="audio-player" controls></audio>

        <!-- Equalizer UI Sliders -->
        <div class="eq-section">
            <div class="slider-group">
                <div class="slider-label">
                    <span>Bass (< 150Hz)</span>
                    <span id="bass-val">0 dB</span>
                </div>
                <input type="range" id="bass" min="-20" max="20" value="0" step="1">
            </div>

            <div class="slider-group">
                <div class="slider-label">
                    <span>Mid (1000Hz)</span>
                    <span id="mid-val">0 dB</span>
                </div>
                <input type="range" id="mid" min="-20" max="20" value="0" step="1">
            </div>

            <div class="slider-group">
                <div class="slider-label">
                    <span>Treble (> 4000Hz)</span>
                    <span id="treble-val">0 dB</span>
                </div>
                <input type="range" id="treble" min="-20" max="20" value="0" step="1">
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('audio-file');
        const audio = document.getElementById('audio-player');
        
        let audioCtx;
        let source;
        let bassFilter, midFilter, trebleFilter;

        // Run as soon as you select an audio track file
        fileInput.addEventListener('change', function() {
            const files = this.files;
            if (files.length === 0) return;

            // Mount the music file safely inside the browser
            const fileURL = URL.createObjectURL(files[0]);
            audio.src = fileURL;

            // Wire up the virtual equalizer graph and start playing
            initAudioContext();
            audio.play();
        });

        function initAudioContext() {
            if (audioCtx) return; // Stop if nodes are already initialized

            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            source = audioCtx.createMediaElementSource(audio);

            // 1. Bass Configuration (Lowshelf captures frequencies below boundary)
            bassFilter = audioCtx.createBiquadFilter();
            bassFilter.type = 'lowshelf';
            bassFilter.frequency.value = 150;
            bassFilter.gain.value = document.getElementById('bass').value;

            // 2. Mid Configuration (Peaking curves directly around center frequency)
            midFilter = audioCtx.createBiquadFilter();
            midFilter.type = 'peaking';
            midFilter.Q.value = 1.0;
            midFilter.frequency.value = 1000;
            midFilter.gain.value = document.getElementById('mid').value;

            // 3. Treble Configuration (Highshelf captures frequencies above boundary)
            trebleFilter = audioCtx.createBiquadFilter();
            trebleFilter.type = 'highshelf';
            trebleFilter.frequency.value = 4000;
            trebleFilter.gain.value = document.getElementById('treble').value;

            // Form the live loop: File -> Bass -> Mid -> Treble -> Hardware Output Speakers
            source.connect(bassFilter);
            bassFilter.connect(midFilter);
            midFilter.connect(trebleFilter);
            trebleFilter.connect(audioCtx.destination);

            // Attach dynamic listener adjustments to the hardware sliders
            setupSliderListener('bass', bassFilter, 'bass-val');
            setupSliderListener('mid', midFilter, 'mid-val');
            setupSliderListener('treble', trebleFilter, 'treble-val');
        }

        function setupSliderListener(sliderId, filterNode, valDisplayId) {
            const slider = document.getElementById(sliderId);
            const display = document.getElementById(valDisplayId);

            slider.addEventListener('input', (e) => {
                const value = e.target.value;
                display.textContent = `${value} dB`;
                if (filterNode) {
                    filterNode.gain.value = value;
                }
            });
        }
    </script>

</body>
</html>
